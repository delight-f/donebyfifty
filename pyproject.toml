[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "donebyfifty"
version = "0.5.0"
description = "General-purpose Monte Carlo retirement simulator"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "rich>=13.0",
]

[project.scripts]
donebyfifty = "donebyfifty.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.7",
    "black==26.5.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-k \"not slow\"')",
]

[tool.coverage.run]
source = ["donebyfifty"]

[tool.coverage.report]
fail_under = 72

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line_length = 100
target_version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D"]
ignore = ["D107"]  # __init__ docstrings are covered by class docstring

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]
"ui_*.py" = ["E501"]
